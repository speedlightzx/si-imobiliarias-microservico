services:
  ollama:
    container_name: ollama
    image: ollama/ollama
    ports:
      - "11434:11434"
    volumes:
      - ollamaData:/root/.ollama

  microservico-python:
    container_name: microservico_llm
    build: .
    ports:
      - "8000:8000"
    depends_on:
      - ollama

volumes:
  ollamaData: